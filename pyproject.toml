[project]
name = "deckforge"
version = "0.1.0"
description = "Template-aware AI presentation generator"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "DeckForge team" }]

[tool.poetry]
packages = [{ include = "deckforge", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# --- домен и валидация ---
pydantic          = "^2.13"
pydantic-settings = "^2.7"

# --- парсинг и запись OOXML ---
python-pptx = "^1.0.2"
lxml        = ">=5.3,<7"
fonttools   = "^4.56"
pillow      = "^11.1"
pypdf       = "^5.3"

# --- контент ---
# Extras обязательны: базовая сборка markitdown не читает ни .docx, ни .pdf, ни .xlsx —
# то есть из контент-пакета заказчика сервис взял бы только markdown и txt (change 7).
markitdown  = { version = "^0.1", extras = ["docx", "pdf", "xlsx", "pptx"] }
# Датасеты читаются из .xlsx напрямую: markitdown отдаёт «2025.0» и «NaN» как значения,
# и на таком Dataset диаграммы потока B строить нельзя. До сих пор openpyxl приезжал
# транзитивно и мог исчезнуть при любой пересборке.
openpyxl    = "^3.1"
pandas      = "^2.2"

# --- вёрстка и графика ---
kiwisolver  = "^1.4"
cairosvg    = "^2.7"
numpy       = "^2.2"

# --- инференс ---
openai      = "^2.0"
httpx       = "^0.28"
jinja2      = "^3.1"
tenacity    = "^9.0"

# --- оркестрация ---
langgraph   = "^1.2"
langgraph-checkpoint-sqlite = "^2.0"

# --- сервис ---
fastapi     = ">=0.133.0,<0.137.0"
uvicorn     = { version = "^0.34", extras = ["standard"] }
arq         = "^0.26"
redis       = "^5.2"
boto3       = "^1.36"
typer       = "^0.15"
structlog   = "^25.1"
pyyaml      = "^6.0"

# --- аудит ---
opencv-python-headless = ">=4.13.0,<5.0"
imagehash              = "^4.3"
language-tool-python   = "^2.9"
scikit-learn           = "^1.6"

[tool.poetry.group.inference]
optional = true

[tool.poetry.group.inference.dependencies]
vllm         = "^0.29"
transformers = ">=5.10.4,<6.0"
torch        = "^2.6"
xgrammar     = ">=0.2.1,<1.0.0"

[tool.poetry.group.ui.dependencies]
streamlit = "^1.42"

[tool.poetry.group.dev.dependencies]
pytest          = "^8.3"
pytest-asyncio  = "^0.25"
pytest-cov      = "^6.0"
hypothesis      = "^6.125"
ruff            = "^0.9"
mypy            = "^1.15"
pre-commit      = "^4.1"
langfuse        = "^2.57"
types-PyYAML    = "^6.0"

[tool.poetry.scripts]
deckforge = "deckforge.cli:app"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "slow: тесты дольше 5 с",
  "needs_llm: требует поднятого инференса",
  "needs_libreoffice: требует LibreOffice headless",
  "cold: работает на холодном шаблоне",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]
# Документация, промпты и сообщения проверок написаны по-русски: правила про
# «похожие на латиницу» символы дают только шум.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Typer объявляет параметры CLI именно вызовами в значениях по умолчанию.
"src/deckforge/cli.py" = ["B008"]
"scripts/*.py" = ["E402"]
"tests/golden/*.py" = ["E402"]

# Границы слоёв проверяются тестом tests/unit/test_architecture_boundaries.py:
# он знает порядок слоёв целиком, а не запрещает один пакет всем подряд.

[tool.mypy]
python_version = "3.12"
packages = ["deckforge"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "pptx.*",
  "lxml.*",
  "cairosvg.*",
  "imagehash.*",
  "language_tool_python.*",
  "cv2.*",
]
ignore_missing_imports = true
