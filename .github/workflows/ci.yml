name: CI

# Минуты Actions на приватном репозитории платные: 2000 в месяц, и к 21.09 ушло 90 %.
# Контроль качества не урезается — урезаются повторы:
#
# * прогон на push в main дублировал прогон PR: слияние — это squash уже проверенной
#   ветки, и каждый PR стоил двух полных прогонов вместо одного;
# * правка одной документации (docs/, *.md, openspec/) кода не меняет — тесты на ней
#   те же, что на предыдущем коммите;
# * новый push в ветку PR отменяет ещё идущий прогон той же ветки: результат старого
#   коммита уже никому не нужен;
# * зависимости живут в образе на ml110 и пересобираются, только когда меняются.
#
# Job идёт на self-hosted runner ml110 (docs/CI-ml110.md): там минуты не считаются.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Runner один — ml110 под пользователем gitlab-runner (docs/CI-ml110.md).
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Тег образа — хэш того, от чего зависят зависимости: поменяли pyproject.toml
      # или Dockerfile — образ собирается заново, иначе берётся готовый.
      - name: image
        run: |
          tag=$(cat pyproject.toml docker/Dockerfile | sha256sum | cut -c1-12)
          echo "IMAGE=localhost/deckforge-ci:$tag" >> "$GITHUB_ENV"
          podman image exists "localhost/deckforge-ci:$tag" \
            || podman build -f docker/Dockerfile -t "localhost/deckforge-ci:$tag" .
      # Контейнер без сети и только с чекаутом: .env стенда и LLM тестам недоступны.
      - name: ruff, mypy, gates, tests
        run: |
          podman run --rm --network none -v "$PWD:/app:z" -w /app \
            -e PYTHONPATH=/app/src "$IMAGE" sh -ec '
              ruff check src tests scripts
              mypy
              python scripts/check_licenses.py
              python scripts/lint_no_template_constants.py
              pytest -q -p no:cacheprovider --cov=deckforge --cov-report=term-missing
            '
      # Прежние теги своего образа — и только их: на сервере образы других проектов,
      # `podman image prune -a` запрещён.
      - name: cleanup
        if: always()
        run: |
          podman images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^localhost/deckforge-ci:' | grep -vx "$IMAGE" \
            | xargs -r podman rmi -f || true
