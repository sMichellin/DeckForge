name: CI

# Минуты Actions на приватном репозитории платные: 2000 в месяц, и к 21.09 ушло 90 %.
# Контроль качества не урезается — урезаются повторы:
#
# * прогон на push в main дублировал прогон PR: слияние — это squash уже проверенной
#   ветки, и каждый PR стоил двух полных прогонов вместо одного;
# * правка одной документации (docs/, *.md, openspec/) кода не меняет — тесты на ней
#   те же, что на предыдущем коммите;
# * новый push в ветку PR отменяет ещё идущий прогон той же ветки: результат старого
#   коммита уже никому не нужен;
# * зависимости кэшируются — их установка занимала заметную часть каждого прогона.
#   Ключ кэша — pyproject.toml: poetry.lock в репозитории нет.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pipx install poetry==2.3.*
      # poetry.lock в репозитории нет, поэтому встроенный кэш setup-python неприменим:
      # ключ — pyproject.toml. Поменяли зависимости — кэш протух сам.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
      - run: poetry install --with dev --no-interaction
      - name: ruff
        run: poetry run ruff check src tests scripts
      - name: mypy
        run: poetry run mypy
      - name: "Гейт C1/C2 — лицензии и размеры моделей"
        run: poetry run python scripts/check_licenses.py
      - name: "Гейт C6 — никаких констант шаблона в src/"
        run: poetry run python scripts/lint_no_template_constants.py
      - name: tests
        run: poetry run pytest -q --cov=deckforge --cov-report=term-missing
