description: >-
  Наполняет один слайд по выбранному макету. Параллелится по слайдам, общий префикс —
  манифест, чтобы работал prefix caching (§12).
  Композицию шаблона слайду выбирает код, а не модель: вид называет план, конкретный
  пример — счёт (`pick_recipe`), зоны раскладывает `bind_to_recipe`. Модель файла
  не видит (ADR-003) и о рецептах не знает.
prompt_ref: slide_composer
model_ref: llm_main
inputs: [slide_plan, layout, content, design_system, variant, seed]
outputs: [slide_ir]
owns: []
retries: 2
fallback: simpler_layout
params:
  guided_decoding: true
  parallel: true
