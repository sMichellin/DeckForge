description: >-
  Планирует состав и порядок слайдов по брифу и контент-пакету. Один вызов на колоду.
prompt_ref: deck_planner
model_ref: llm_main
# Дизайн-система шаблона — вход, а не догадка: виды композиций шаблона попадают
# в меню плана (`plan-by-the-design-system`).
inputs: [content, manifest, design_system, variant, seed]
outputs: [plan]
owns: []
retries: 2
fallback: reduce_target_slides
params:
  enforce_headline_is_conclusion: true
  max_slides: 15
