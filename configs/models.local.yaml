# Реестр для локального llama.cpp-сервера:
#   DECKFORGE_MODELS_CONFIG=models.local.yaml
#   DECKFORGE_VLM_BASE_URL=http://<хост>:<порт>/v1
#   DECKFORGE_VLM_API_KEY=none        (llama.cpp ключ не проверяет, но клиент требует непустой)
#
# ВАЖНО: hf_id ниже — это путь к файлу модели на сервере, а не имя на HuggingFace.
# llama.cpp принимает только то, что отдаёт его собственный /v1/models: на любое другое
# имя он закрывает соединение без ответа («Empty reply from server»), а не возвращает 404.
# После перезапуска сервера с другим файлом путь нужно сверить заново:
#   curl -s http://<хост>:<порт>/v1/models | python3 -c "import sys,json;print(json.load(sys.stdin)['data'][0]['id'])"
#
# Чем этот путь ценен: поминутного лимита нет вовсе, а Groq на замере стабильности
# (17.09) за 15 минут не отдал ни одного вердикта.
#
# ПРАВКА 18.09 по факту замера. Прежняя цифра «2.6–5.4 с на вызов» получена на коротких
# запросах. На настоящем замере — 141 вызов судьи с превью 1500×1125 — вышло **28 с
# на вызов** (4010 с на 141 вызов, последовательно). Разница в картинке: её обработка
# и стоит основное время. Вывод, который из этого следует, неприятный: семантический
# аудит колоды в бюджет C5 (300 с) на этом сервере **не укладывается** даже при 84 вызовах
# на чистой колоде — нужен параллелизм и проверка, держит ли его сервер. Замер:
# scripts/bench_judge_stability.py.
#
# Роли разведены сознательно. Модель на сервере — community-мерж со снятым выравниванием
# («Heretic-Uncensored»): она охотнее выдаст то, чему в деловой колоде не место. Судить
# и классифицировать это не мешает — там она оценивает готовое, а не сочиняет. Поэтому
# planning и composition остаются на обычной Qwen3.8-27B у внешнего провайдера.
models:
  llm_main:
    hf_id: "Qwen/Qwen3.8-27B"
    license: "apache-2.0"
    params_total_b: 27.8
    role: "planning,composition"
    endpoint_ref: "llm"
    notes: >-
      Сочиняет текст колоды, поэтому остаётся на модели с сохранённым выравниванием.
      Эндпоинт задаётся отдельно от vlm: DECKFORGE_LLM_BASE_URL.
  llm_fast:
    hf_id: "/home/joni/Downloads/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-IQ4_XS.gguf"
    license: "apache-2.0"
    params_total_b: 26.9
    role: "composition,bulk"
    endpoint_ref: "vlm"
    # Замер 18.09, уточнён тем же вечером. Сквозной прогон падал на стадии плана
    # с `400 Failed to initialize samplers: failed to parse grammar`, и сначала мы
    # выключили structured output целиком. Проверка вариантов схемы показала, что дело
    # не в схеме `DeckPlan` как таковой, а **в двух полях с `pattern`**: без них та же
    # схема компилируется. Поэтому structured output вернулся, а `pattern` не шлётся —
    # его всё равно проверяет Pydantic. Отдать форму без одного ограничения лучше,
    # чем не отдать формы вовсе: без неё модель возвращает свою структуру.
    supports_schema_patterns: false
    notes: >-
      Веса: DavidAU/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NEO-CODER-MAX-MTP-GGUF,
      квантование IQ4_XS, 16.6 ГБ. Родословная проверена: единственный предок —
      Qwen/Qwen3.8-27B, тоже apache-2.0, чужих лицензий в мерже нет.
  vlm_judge:
    hf_id: "/home/joni/Downloads/Qwen3.8-27B-TurboFCFusion-735-882-Here-Uncen-NEO-CODER-MAX-IQ4_XS.gguf"
    license: "apache-2.0"
    params_total_b: 26.9
    role: "audit,layout-classification"
    endpoint_ref: "vlm"
    # Тот же сервер, что у llm_fast: неспособность собрать грамматику с `pattern` —
    # свойство бэкенда, а не роли. Схема судьи из двух полей его не содержит и работает
    # (141 вызов в замере стабильности), но объявляем честно — иначе первая же проверка
    # с `pattern` отвалится с 400 и искать причину будем заново.
    supports_schema_patterns: false
    notes: >-
      Картинки принимает, JSON Schema держит. Размышляет: пустой ответ при
      finish_reason=length означает нехватку бюджета токенов, а не отказ — клиент
      добирает бюджет сам (inference/client.py).
  t2i:
    hf_id: "Qwen/Qwen-Image"
    license: "apache-2.0"
    params_total_b: 20.0
    role: "slide-images"
    endpoint_ref: "t2i"
    notes: "llama.cpp изображения не генерирует — роль остаётся незакрытой."

constraints:
  allowed_licenses: ["apache-2.0", "mit"]
  max_params_b_llm: 35
  max_params_b_t2i: 20
