# Воспроизводимый запуск (C11). Профиль переопределяет эти значения.
seed: 1337
language: ru
target_slides: 12
variants: [A, B, C]
exports: [pptx, pdf, html]

# Бюджет C5: колода 10–15 слайдов за ≤ 5 минут
time_budget_s: 300
parallel_slides: 6

models:
  planning: llm_main
  composition: llm_main
  bulk: llm_fast
  judge: vlm_judge
  image: t2i

audit:
  run_deterministic: true
  # Судья-VLM на локальном сервере с одним слотом даёт 36 минут на колоду из десяти
  # слайдов при бюджете C5 в 5 минут (прогон 05884387b999: 2164 с из 2266 с).
  # Детерминированные проверки укладываются в секунды и остаются включёнными всегда.
  # Включать осознанно: профилем прогона или `audit.run_semantic` в запросе.
  run_semantic: false
  vlm_votes: 3
  vlm_confidence_threshold: 0.6
  auto_fix: true
  max_fix_rounds: 2
