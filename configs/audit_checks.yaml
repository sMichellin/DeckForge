# Реестр проверок аудита (ARCHITECTURE.md §5, AUDIT.md).
# Пороги живут здесь, а не в коде: изменение порога не требует правки пайплайна.
checks:
  # --- вёрстка (детерминированные) ---
  layout.out_of_bounds:
    deterministic: true
    severity: error
    title: "Элемент вышел за границы слайда"
  layout.overlap:
    deterministic: true
    severity: error
    title: "Два блока наложились друг на друга"
    params: { min_overlap_ratio: 0.05 }
  layout.text_overflow:
    deterministic: true
    severity: error
    auto_fix: shrink_font
    title: "Текст не помещается в свою рамку"
  layout.text_clipped:
    deterministic: true
    severity: error
    title: "Текст обрезан краем слайда"
  layout.off_guides:
    deterministic: true
    severity: warning
    auto_fix: snap_to_guide
    title: "Блоки не выровнены по направляющим макета"
    params: { tolerance_emu: 45720 }
  layout.margin_violation:
    deterministic: true
    severity: warning
    title: "Контент заходит в поля у краёв"
  layout.image_aspect_distorted:
    deterministic: true
    severity: error
    title: "Картинка растянута, пропорции нарушены"
    params: { max_aspect_delta: 0.02 }

  # --- шаблон ---
  template.font_not_in_theme:
    deterministic: true
    severity: error
    title: "Шрифт не из шаблона или гарнитур больше двух"
    params: { max_families: 2 }
  template.size_not_in_scale:
    deterministic: true
    severity: warning
    title: "Кегль не из типографической шкалы шаблона"
  template.color_not_in_palette:
    deterministic: true
    severity: error
    auto_fix: map_to_nearest_theme_color
    title: "Цвет не из палитры шаблона"
    params: { max_delta_e: 12 }
  template.layout_not_from_template:
    deterministic: true
    severity: error
    title: "Слайд собран не на макете из шаблона"
  template.decor_moved:
    deterministic: true
    severity: warning
    title: "Логотип или колонтитул сдвинуты с положенного места"
    # Доля площади знака, которую блок должен закрыть, чтобы считаться накрывшим его.
    # Прежний tolerance_emu был длиной и сравнивался с площадью в EMU² — то есть с нулём.
    params: { min_cover_ratio: 0.5 }
  template.contrast_below_wcag:
    deterministic: true
    severity: error
    title: "Контраст текста к фону ниже порога своего класса"
    # Минимум по классу текста. Класс (крупный, обычный, графика) выбирает
    # designsystem.contrast по кеглю и начертанию шаблона — здесь только значения.
    # Подпись берёт минимум своего кегля; ниже комфортного порога слоя — находка info.
    params: { body: 4.5, large: 3.0, graphics: 3.0 }
  template.sample_text_left:
    deterministic: true
    severity: error
    title: "На слайде по рецепту остался текст слайда-примера шаблона"
    # Слайд по рецепту — копия примера шаблона. Любой текст на нём, которого нет в IR
    # колоды, пришёл из примера: чужая фраза в колоде хуже пустой рамки.
  template.recipe_not_in_catalogue:
    deterministic: true
    severity: error
    title: "Слайд назван рецептом, которого нет в каталоге шаблона"
    # Каталог — `designsystem.derive(manifest).recipes`, тот же, что у писателя.
    # Рецепт вне каталога — выдумка модели: писатель такой слайд не соберёт.
  template.slide_without_recipe:
    deterministic: true
    severity: info
    title: "Слайд собран не по рецепту, хотя у шаблона есть каталог композиций"
    # Оговорка, не ошибка: слайд по макету корректен, но мимо дизайн-системы шаблона.
    # Каталог пуст — проверка пропускается (CheckUnavailable), а не «прошла».

  # --- плотность ---
  density.too_many_bullets:
    deterministic: true
    severity: warning
    auto_fix: split_slide
    title: "Больше 6 буллетов на слайде"
    params: { max_bullets: 6 }
  density.bullet_too_long:
    deterministic: true
    severity: warning
    auto_fix: shorten_text
    title: "Буллет длиннее 15 слов"
    params: { max_words: 15 }
  density.table_too_big:
    deterministic: true
    severity: warning
    title: "Таблица больше 7 строк или 5 колонок"
    params: { max_rows: 7, max_cols: 5 }
  density.too_many_series:
    deterministic: true
    severity: warning
    title: "Больше 5 серий на диаграмме"
    params: { max_series: 5 }
  density.fill_ratio:
    deterministic: true
    severity: warning
    title: "Слайд заполнен меньше четверти или больше трёх четвертей"
    params: { min_ratio: 0.25, max_ratio: 0.75 }
  # Метрики по картинке слайда, а не по рамкам IR. Пороги — по замерам на прогонах:
  # смещение 0,29–0,44 у колоды, где текст жался к верхнему краю (693d464d54fb),
  # против 0,04–0,20 после центрирования (5f20ce07e504, ed84aa87620c). Чернила
  # у живых колод — 1,9–8,6 %, поэтому 0,5 % это пустой слайд, а 15 % — свалка.
  design.ink_balance:
    deterministic: true
    severity: warning
    title: "Содержание слайда прижато к краю или слайд перегружен"
    # Пустая зона — «excessive whitespace» AeSlides (arXiv:2604.22840), в двух измерениях
    # (C9). Пределы по осям отдельные, а не один на площадь: широкая и низкая зона —
    # это воздух над рядом показателей (100 × 32 %), а дефект и широк, и высок разом
    # (47 × 100 % на f0b9ff6f0a74, 55 × 100 % на 1d0bc29cf23f). 0.4 по ширине — та же
    # величина, которой мерится B8.
    #
    # Дисбаланс — эллипс AeSlides: допуск по горизонтали строже, чем по вертикали,
    # потому что колода читается сверху вниз. В работе x_tol 0.05; здесь 0.10 — ужесточить
    # втрое разом, не откалибровав на прогонах, значит превратить предупреждение в шум.
    # Довести до 0.05 — правка одного числа здесь, см. proposal C9.
    params: { min_ink: 0.005, max_ink: 0.15,
              zone_min_w: 0.4, zone_min_h: 0.4, zone_needs_imbalance: 0.5,
              x_tol: 0.10, y_tol: 0.15, max_imbalance: 1.0 }

  # --- целостность ---
  integrity.file_opens:
    deterministic: true
    severity: error
    title: "Файл не открывается"
  integrity.placeholder_text:
    deterministic: true
    severity: error
    title: "Остался текст-заглушка: lorem ipsum, XXX, TODO"
  integrity.empty_slide:
    deterministic: true
    severity: error
    title: "Пустой слайд или слайд с одним заголовком"
  integrity.content_lost:
    deterministic: true
    severity: error
    title: "От слайда остался один заголовок, хотя план дал ему факты"
  integrity.slide_is_image:
    deterministic: true
    severity: error
    title: "C3: слайд оказался картинкой, а не редактируемыми объектами"
  integrity.chart_labels_missing:
    deterministic: true
    severity: warning
    title: "У диаграммы нет подписей осей, единиц или легенды"
  integrity.duplicate_slides:
    deterministic: true
    severity: warning
    title: "Два слайда дублируют друг друга"
    params: { phash_distance: 6, text_cosine: 0.92 }

  # --- контент: орфография детерминирована (LanguageTool), не модель ---
  content.no_typos:
    deterministic: true
    severity: warning
    title: "Текст без опечаток"

  # --- контент: VLM-судья, 11 вопросов Приложения 1 ТЗ ---
  content.headline_is_conclusion:
    deterministic: false
    severity: warning
    auto_fix: regenerate_headline
    title: "Заголовок содержит вывод, а не просто называет тему"
  content.body_matches_headline:
    deterministic: false
    severity: warning
    title: "Содержимое слайда соответствует заголовку"
  content.one_sentence_summary:
    deterministic: false
    severity: info
    title: "Слайд пересказывается одним предложением"
  content.numbers_grounded:
    deterministic: true
    severity: error
    title: "Все цифры и факты со слайда есть в исходных материалах"
  content.has_substance:
    deterministic: false
    severity: warning
    title: "На слайде есть содержание, а не только заголовок"
  design.unlike_the_template:
    deterministic: true
    severity: warning
    title: "Слайд не похож на родные слайды шаблона"
    # Профиль оформления по слайдам-примерам шаблона (DS7, она же C8). Порог здесь
    # не в единицах метрики, а в межквартильных размахах самого шаблона: «правильная»
    # плотность у минималистичного и у плотного дизайна разная (arXiv:2508.19289).
    # 3.0 откалиброван на 138 примерах трёх шаблонов кейса: при нём ни один родной
    # слайд не объявляется чужим, при 1.5 их 15–24 %. Пустой слайд ловится и при 3.0
    # с четырёхкратным запасом.
    params:
      profile_tolerance: 3.0
  content.visuals_on_topic:
    deterministic: false
    severity: warning
    title: "Картинки и иконки относятся к теме слайда"
  content.no_prompt_leftovers:
    deterministic: false
    severity: error
    title: "Нет служебного мусора: реплик спикера, кусков промпта"
  content.single_language:
    deterministic: true
    severity: warning
    title: "Вся колода на одном языке"
  content.table_rows_meaningful:
    deterministic: false
    severity: info
    title: "Все строки таблицы и элементы легенды работают на мысль слайда"
  content.neighbours_connected:
    deterministic: false
    severity: info
    title: "Соседние слайды связаны между собой по логике"
