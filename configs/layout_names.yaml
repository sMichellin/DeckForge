# Слова в именах макетов → вид макета (Т8, change `layout-name-votes`,
# docs/agents/requirements-from-notes-26-09.md).
#
# Решение владельца 26.09: имя макета — ДОПОЛНИТЕЛЬНЫЙ сигнал (порог поднят до 0.9 тем же днём). Вид по составу
# плейсхолдеров остаётся главным: имя решает, только пока эвристика неуверенна
# (уверенность ниже `name_wins_below`). Уверенная эвристика при расхождении с именем
# остаётся в силе, расхождение пишется в заметки прогона. На шаблоне без осмысленных
# имён («Custom Layout 14») словарь молчит, и поведение прежнее.
#
# Слова — основы, ищутся подстрокой в имени без учёта регистра. Порядок видов важен:
# первый совпавший и есть вид. Финал и раздел раньше титула: «Титульный слайд раздела» —
# раздел. Содержание раньше титула: стандартное «Title and Content» — не титул.
# Не шаблонные константы (правило 2 AGENTS.md): это слова языка, а не имена макетов
# конкретного шаблона.

name_wins_below: 0.9

kinds:
  closing: [спасибо, финальн, заключительн, вопросы, thank, closing, final, "the end"]
  section: [раздел, section, divider, глава, chapter]
  custom: [контент, content, свободн, blank, пуст]
  title: [титул, обложк, title, cover]
