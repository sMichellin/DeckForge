# Защита инициативы, бюджет не запрашивается.
purpose: initiative
audience: >-
  Директор по разработке и руководители трёх команд. Решают, принять ли
  общий порядок работы, а не выделить деньги.
target_slides: 10
language: ru
tone: убеждающий, опора на логику, а не на цифры
key_message: >-
  Единый порядок ревью убирает спор о том, чья очередь смотреть код,
  и не требует ни бюджета, ни новых людей.
