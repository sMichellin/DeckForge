# Питч новой функции внутри существующего продукта.
purpose: feature
audience: >-
  Продуктовый комитет: руководитель продукта, тимлиды разработки, представитель поддержки.
  Решают, брать ли функцию в ближайший квартал.
target_slides: 10
language: ru
tone: рабочий, без пафоса
key_message: >-
  Умные напоминания убирают главную причину задержек согласования —
  документ, про который все забыли.
