model_ref: llm_main
response_model: deckforge.domain.plan.DeckPlan
# Поля, которые заполняет код: вариант, seed и язык известны до вызова, отчёт по нарративу
# считает planning.narrative. Модель их не присылает (прогон 59e0014d2fdc: variant="report").
response_omit: [variant, seed, language, narrative_check]
temperature: 0.3
top_p: 0.95
max_tokens: 8192
author: DeckForge team
changelog: |
  1.3.0 — план даёт слайду заметку докладчика (change `the-speaker-gets-a-note`, RG34).
    Поле `speaker_note` проложено сквозь весь конвейер — план, IR, писатель, html, фиксы,
    схема ответа — но ни один промпт его не просил, и в трёх `deck.pptx` 24.09 частей
    `notesSlide` 0, 0, 0. Правило 11: заметка — не пересказ слайда, а довод вслух,
    ожидаемый вопрос или связка со следующим; числа — по правилу 3; титулу, разделу
    и финалу пустая заметка законна. В самопроверке задания — тот же пункт. Схема ответа
    не менялась: поле в ней уже есть. Композитор заметку не просит — она переходит
    из плана (`composer`: `ir.speaker_note or slide.speaker_note`).
  1.2.0 — план заказывает элементы дизайн-системы шаблона (change
    `plan-by-the-design-system`). Прежде словарь заказа знал только kpi, table, image,
    chart и smartart: цитату, callout и стили списка ставил или не ставил композитор
    сам, и ДС шаблона до плана не доходила. Правило 10 получает меню ДС — `quote`,
    `callout:insight`, `callout:risk`, `bullets:numbered`, `bullets:icon` — с назначением
    каждого элемента из самой ДС (тот же текст, что на её странице и у композитора).
    Меню строится только из того, что в ДС шаблона есть; без ДС раздел не выводится,
    и промпт равен 1.1.0. В самопроверке задания — тот же пункт. Схема ответа не менялась:
    `suggested_visual` — строка, словарь сверяет код (`planning.visuals`).
  1.1.0 — стрелки в тексте — признак процесса (A12). VK Tech s04, прогон d0b37773345e:
    «Анализ шаблона → извлечение структуры → генерация…» ушло на слайд строкой 12 pt,
    а не схемой. Правило 10 называет стрелки прямым признаком `smartart:process`
    и отделяет от них одну стрелку между значениями («10 → 20 %» — изменение, не процесс);
    в самопроверке задания — тот же пункт. Схема ответа не менялась.
  1.0.0 — состав и порядок слайдов, заголовки-выводы, привязка фактов.
    Каркас структуры под каждое из пяти назначений ТЗ; целевое действие на последнем
    слайде; предел длины заголовка; ограничение доли одной роли; запрет дописывать
    за автора; тон и терминология из брифа; порядок по профилю варианта.
    Версия не поднята: 1.0.0 никогда не запускалась, change (10) её первый потребитель.
    max_tokens 4096 → 8192: Qwen3.x отдают размышление отдельно, и на плане из 12 слайдов
    бюджета не хватало на сам ответ.
