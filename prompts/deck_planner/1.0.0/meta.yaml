model_ref: llm_main
response_model: deckforge.domain.plan.DeckPlan
# Поля, которые заполняет код: вариант, seed и язык известны до вызова, отчёт по нарративу
# считает planning.narrative. Модель их не присылает (прогон 59e0014d2fdc: variant="report").
response_omit: [variant, seed, language, narrative_check]
temperature: 0.3
top_p: 0.95
max_tokens: 8192
author: DeckForge team
changelog: |
  1.0.0 — состав и порядок слайдов, заголовки-выводы, привязка фактов.
    Каркас структуры под каждое из пяти назначений ТЗ; целевое действие на последнем
    слайде; предел длины заголовка; ограничение доли одной роли; запрет дописывать
    за автора; тон и терминология из брифа; порядок по профилю варианта.
    Версия не поднята: 1.0.0 никогда не запускалась, change (10) её первый потребитель.
    max_tokens 4096 → 8192: Qwen3.x отдают размышление отдельно, и на плане из 12 слайдов
    бюджета не хватало на сам ответ.
