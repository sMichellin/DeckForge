model_ref: llm_main
# Схема ответа у этой версии **своя на каждый слайд**: она собирается из паспорта
# назначенного примера (`composition/places.py::response_schema`), потому что предел
# знаков у каждого места свой и число повторов ряда назначает шаг 2 плана Б.
# Поэтому здесь нет ни schema.json, ни `response_model`: доменной моделью ответ
# не валидируется — он ложится в места один к одному и становится `SlideIR` в коде.
temperature: 0.2
top_p: 0.9
max_tokens: 4096
author: DeckForge team
changelog: |
  2.2.0 — число берётся из фактов, а номер прогона не попадает в слайд (план Б, круг 2,
    корень К2, change `numbers-come-from-facts`). На прогоне 29.09 — 19 находок
    `content.numbers_grounded`: «1» на обложке WorkSpace, «2 задачи», «1 сервис»,
    «100 %», «0 ошибок», «10x». Все 24 заполнения мест-чисел пришлись на слайды, где
    в фактах не было ни одной цифры: место **просило** число, и модель его выдумывала.
    Теперь такое место композиция не заказывает вовсе, а правило 5 называет запрет прямо.
    Оттуда же убрана строка «Seed: {{ seed }}»: на финале Education модель взяла из неё
    «1341» и поставила крупным числом на слайд. Seed уходит в запрос параметром.
  2.1.0 — предел места назван промптом, а схема даёт запас (план Б, круг 2, корень К1,
    change `the-limit-is-not-a-guillotine`). На прогоне 29.09 семь текстов оказались
    длиной ровно в ёмкость места, пять из них оборваны посреди слова («AI не копирует
    фирменны», «Open-source для презент», «…создание слай»): грамматика llama.cpp держит
    `maxLength` знаками и обрывает генерацию на знаке. Схема теперь даёт запас поверх
    ёмкости, а правило 2 промпта говорит прямо: предел формата — воздух на окончание
    мысли, предел места — настоящий. Текст, упёршийся в потолок схемы, композиция считает
    оборванным и просит короче.
  2.0.0 — текст пишется под места слайда-примера (план Б, шаг 3, ADR-009,
    change `the-text-is-written-for-the-places`). Прежние версии писали текст под макет,
    а о примере знали одно число — ёмкость самой тесной зоны; раскладка потом снимала
    лишние блоки, сплющивала схемы в строку и склеивала пункты (на трёх колодах 28.09 —
    11 снятых блоков и 5 сокращений кодом). Здесь модель видит сами места: ступень
    лестницы, предел знаков и сколько повторов ряда заполнить. Предел держит схема
    ответа, а не просьба в тексте промпта.
    Версия активируется в `prompts/registry.yaml` вместе с приёмкой плана Б (файл
    тимлида): до неё путь `legacy` работает на активной версии 1.5.0, а этот промпт
    берётся по имени версии — пути живут рядом, и схемы ответа у них разные.
