model_ref: llm_main
response_model: deckforge.domain.slide.SlideIR
# Поля, которых модель не задаёт: координаты считает слой вёрстки. Выбрасываются из
# schema.json генератором (`make schemas`); в строгом режиме они иначе обязательны.
# slide_id, layout_id, variant и provenance проставляет сам композитор (`_bind`).
response_omit: [x, y, cx, cy, slide_id, layout_id, variant, provenance]
temperature: 0.2
top_p: 0.9
max_tokens: 4096
author: DeckForge team
changelog: |
  1.3.1 — акцент блоков снова по порядку слотов темы, `accent1` первым (решение тимлида
    23.09, change `accent-by-slot-order`). Порядок по доле площади на слайдах-примерах
    (1.3.0) ставил показатели VK Tech розовыми, VK WorkSpace — светло-голубыми вместо
    фирменного синего. Абзац «акценты этого шаблона по роли… будет снят» убран:
    композитор цвет, названный моделью, больше не снимает. Схема ответа не менялась.
  1.3.0 — композиция по дизайн-системе шаблона (DG3, change `compose-by-the-design-system`).
    Схема ответа: `quote` и `callout` больше не удерживаются (`WITHHELD_BLOCK_TYPES` пуст —
    рендер их рисует с #149), у `bullets` — `style` (bulleted | numbered | icon), у пункта —
    `icon` (имя Lucide). Правило 2: цвет блокам не задаётся; если нужен — только акцент
    шаблона по роли из дизайн-системы (`accent_roles`), иначе снимается композитором.
    Правило 11: стиль списка по смыслу пунктов, назначения стилей — из дизайн-системы;
    номера в текст не писать; иконочный список — свободным блоком, иконка у каждого пункта.
    Правило 12: когда уместны цитата (прямая речь из фактов, с автором; не выдумывать)
    и callout «инсайт» / «риск» (назначения из дизайн-системы). Координат промпт
    по-прежнему не содержит: в него уходят роли цветов и виды, а не EMU.
  1.2.0 — свободная зона рядом с телом (B10): промпт называет её вместимость и просит
    второй блок без `placeholder_idx`. Схема ответа не менялась.
  1.1.0 — стрелки в тексте — процесс, записанный строкой (A12). VK Tech s04, прогон
    d0b37773345e: «Анализ шаблона → извлечение структуры → генерация…» легло строкой
    12 pt в полосу под заголовком, а не схемой. Правило 10: такой факт собирается
    `smartart` вида `process`, части между стрелками — подписи узлов; строку со стрелками
    в текст не ставить. Одна стрелка между значениями — изменение, не процесс.
    Не выполненное правило композиция называет в отчёте. Схема ответа не менялась.
    Профиль `dev` по-прежнему закреплён на 1.0.0 (`registry.yaml`).
  1.0.0 — распределение контента по плейсхолдерам выбранного макета.
    Рычаг деградации: по умолчанию сокращается текст, при просьбе сохранить формулировки —
    упрощается визуализация. Тип диаграммы приходит готовым из domain.rules и не меняется.
    Источник числа остаётся на слайде. Версия не поднята: 1.0.0 не запускалась,
    change (11) её первый потребитель. max_tokens 2048 → 4096 под размышляющие модели.
    После правки схемы ответа (#32) добавлен раздел «чего от тебя не требуется»:
    координаты, подписи осей и provenance модель не задаёт — их ставят слой вёрстки,
    рендерер и сам композитор. Схема этого больше не просит, промпт теперь тоже.
    После интеграционного прогона: тексту в плейсхолдере цвет не задаётся вовсе —
    на тёмном фоне заголовки выходили dk1 по тёмному. Цвет ставит макет.
    После прогона 4197f2e8331f: когда в макете нет места под тело, промпт **просит**
    основной текст свободным блоком, а не запрещает его. Правило 1 запрещало чужие idx,
    вместимость показывалась нулевая — модель честно отдавала один заголовок, и колода
    выходила без текста. Добавлено правило 10: шаги и циклы собираются smartart
    из фигур PowerPoint, цифры — kpi. Версия не поднята: `registry.yaml` пинит 1.0.0
    и в профиле dev, а он принадлежит тимлиду.
