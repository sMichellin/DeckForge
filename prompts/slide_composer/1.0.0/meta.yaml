model_ref: llm_main
response_model: deckforge.domain.slide.SlideIR
# Поля, которых модель не задаёт: координаты считает слой вёрстки. Выбрасываются из
# schema.json генератором (`make schemas`); в строгом режиме они иначе обязательны.
# slide_id, layout_id, variant и provenance проставляет сам композитор (`_bind`).
response_omit: [x, y, cx, cy, slide_id, layout_id, variant, provenance]
temperature: 0.2
top_p: 0.9
max_tokens: 4096
author: DeckForge team
changelog: |
  1.0.0 — распределение контента по плейсхолдерам выбранного макета.
    Рычаг деградации: по умолчанию сокращается текст, при просьбе сохранить формулировки —
    упрощается визуализация. Тип диаграммы приходит готовым из domain.rules и не меняется.
    Источник числа остаётся на слайде. Версия не поднята: 1.0.0 не запускалась,
    change (11) её первый потребитель. max_tokens 2048 → 4096 под размышляющие модели.
    После правки схемы ответа (#32) добавлен раздел «чего от тебя не требуется»:
    координаты, подписи осей и provenance модель не задаёт — их ставят слой вёрстки,
    рендерер и сам композитор. Схема этого больше не просит, промпт теперь тоже.
    После интеграционного прогона: тексту в плейсхолдере цвет не задаётся вовсе —
    на тёмном фоне заголовки выходили dk1 по тёмному. Цвет ставит макет.
    После прогона 4197f2e8331f: когда в макете нет места под тело, промпт **просит**
    основной текст свободным блоком, а не запрещает его. Правило 1 запрещало чужие idx,
    вместимость показывалась нулевая — модель честно отдавала один заголовок, и колода
    выходила без текста. Добавлено правило 10: шаги и циклы собираются smartart
    из фигур PowerPoint, цифры — kpi. Версия не поднята: `registry.yaml` пинит 1.0.0
    и в профиле dev, а он принадлежит тимлиду.
