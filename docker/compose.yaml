# Запуск: podman compose -f docker/compose.yaml up -d
# Локально ничего не устанавливается — все зависимости живут в образах.
name: deckforge

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    volumes:
      - ../artifacts:/app/artifacts:z
      - ../submission:/app/submission:z
    depends_on: [redis, minio, languagetool]
    command: ["uvicorn", "deckforge.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8080:8080"]

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    volumes:
      - ../artifacts:/app/artifacts:z
    depends_on: [redis, minio, soffice]
    command: ["arq", "deckforge.api.worker.WorkerSettings"]

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    depends_on: [app]
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ../frontend:/app/frontend:z
    ports: ["8501:8501"]

  soffice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.libreoffice
    volumes:
      - ../artifacts:/work:z
    entrypoint: ["sleep", "infinity"]

  languagetool:
    image: docker.io/erikvl87/languagetool:latest
    environment:
      - langtool_languageModel=/ngrams
      - Java_Xms=512m
      - Java_Xmx=2g
    ports: ["8010:8010"]

  redis:
    image: docker.io/library/redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: docker.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

volumes:
  minio-data:
