# Запуск: podman compose -f docker/compose.yaml up -d
# Локально ничего не устанавливается — все зависимости живут в образах.
name: deckforge

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    # Внутри сети compose сервис виден по имени; адрес из .env (обычно localhost)
    # здесь указывает внутрь самого контейнера.
    environment:
      - DECKFORGE_LANGUAGETOOL_URL=http://languagetool:8010
    volumes:
      - ../artifacts:/app/artifacts:z
      - ../submission:/app/submission:z
    depends_on: [redis, languagetool]
    command: ["uvicorn", "deckforge.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8080:8080"]

  # Воркер собирается из своего образа: рендер превью запускает soffice подпроцессом,
  # а подпроцесс не умеет стартовать в соседнем контейнере.
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file: [../.env]
    # Аудит в связке с Redis выполняет воркер, а не app, — ему LanguageTool и нужен.
    environment:
      - DECKFORGE_LANGUAGETOOL_URL=http://languagetool:8010
    volumes:
      - ../artifacts:/app/artifacts:z
    depends_on: [redis, languagetool]
    command: ["arq", "deckforge.api.worker.WorkerSettings"]

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: [../.env]
    depends_on: [app]
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ../frontend:/app/frontend:z
    ports: ["8501:8501"]

  # Без n-грамм: каталог /ngrams никуда не смонтирован, и с ним сервис падал при старте
  # («LanguageModel directory not found»). Для русского n-грамм у LanguageTool нет вовсе.
  languagetool:
    image: docker.io/erikvl87/languagetool:latest
    environment:
      - Java_Xms=512m
      - Java_Xmx=2g
    ports: ["8010:8010"]

  # Артефакты лежат на смонтированном томе ../artifacts, общем для app и воркера.
  # MinIO здесь был, но к S3 код не обращался ни разу — убран. Понадобится, когда
  # воркеры разъедутся по разным хостам и общий том исчезнет (service-api, п. 6).
  redis:
    image: docker.io/library/redis:7-alpine
    ports: ["6379:6379"]

